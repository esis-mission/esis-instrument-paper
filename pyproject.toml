[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "esis-instrument-paper"
authors = [
    {name = "Roy T. Smart", email = "roytsmart@gmail.com"},
]
description = "An AAS journal article describing the EUV Snapshot Imaging Spectrograph (ESIS) sounding rocket instrument."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pylatex~=1.4",
    "aastex~=0.6",
    "num2words~=0.5",
    "named-arrays~=2.14,>=2.14.1",
    "optika~=3.1",
    # TODO: the arms of the grating are esis #102, not released yet; this pin
    # names the branch and goes back to a version once it is.
    "euv-snapshot-imaging-spectrograph @ git+https://github.com/esis-mission/esis@feature/grating-distances",
    "utu~=0.1",
    "fiasco~=0.8.2",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "pytest",
]
doc = [
    "pytest",
    "matplotlib",
    "graphviz",
    "sphinx-autodoc-typehints",
    "pydata-sphinx-theme",
    "ipykernel",
    "sphinx-favicon",
]

[project.urls]
Homepage = "https://github.com/esis-mission/esis-instrument-paper"

[tool.setuptools.packages.find]
include = ["esis_instrument_paper*"]

[tool.setuptools.package-data]
esis_instrument_paper = ["*.cls", "*.bst", "*.bib", "*.png"]

[tool.setuptools_scm]
