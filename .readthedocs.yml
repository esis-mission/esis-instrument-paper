version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - graphviz
    - texlive-publishers
    - texlive-science
    - cm-super
  jobs:
    post_build:
      - python -c "import esis_instrument_paper; esis_instrument_paper.pdf()"
      - mkdir $READTHEDOCS_OUTPUT/pdf/
      - mv esis_instrument_paper/esis-instrument.pdf $READTHEDOCS_OUTPUT/pdf/

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - doc
