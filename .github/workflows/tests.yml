name: tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [
          ubuntu-latest,
        ]
        python-version: ["3.12", "3.13"]
    name: ${{ matrix.os }}, Python ${{ matrix.python-version }} test
    steps:
      - name: Install LaTeX
        # `apt-get` waits forever if another process on the runner holds the
        # dpkg lock, so bound that wait and answer its prompts non-interactively.
        # The index the runner ships with goes stale, and installing against a
        # stale one asks the mirror for versions it has since replaced.
        run: >-
          sudo apt-get update -o DPkg::Lock::Timeout=300 &&
          sudo apt-get install -y -o DPkg::Lock::Timeout=300
          texlive-publishers texlive-science cm-super latexmk libcairo2-dev
          dvipng
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
      # The article reads the CHIANTI atomic database twice over: for the
      # emission measure of the quiet Sun and for the version it names in a
      # caption, and to compute the lines of the passband. The database is
      # several gigabytes and the lines take a quarter of an hour, so both
      # are cached, and the second is keyed on the first: a spectrum computed
      # from one version of the database must not be served beside another.
      - name: Ask fiasco which database it wants
        id: chianti
        run: |
          python -c "
          from fiasco.util.setup_db import LATEST_VERSION
          print(f'version={LATEST_VERSION}')
          " >> $GITHUB_OUTPUT
      - name: Restore the CHIANTI database
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.fiasco
          key: chianti-${{ steps.chianti.outputs.version }}
      - name: Download and build the CHIANTI database
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python -c "
          import fiasco
          from fiasco.util import check_database
          check_database(
              hdf5_dbase_root=fiasco.defaults['hdf5_dbase_root'],
              ascii_dbase_root=fiasco.defaults['ascii_dbase_root'],
              ask_before=False,
              show_progress=False,
          )
          "
      - name: Restore the spectrum computed from it
        uses: actions/cache@v4
        with:
          path: ~/.esis/cache/esis_instrument_paper
          key: >-
            spectrum-${{ steps.chianti.outputs.version }}-${{
            hashFiles('esis_instrument_paper/_spectrum.py') }}
          # An older spectrum is worth restoring even when this module has
          # changed, since `joblib` decides for itself whether what it holds
          # still answers the question, and recomputes when it does not.
          restore-keys: |
            spectrum-${{ steps.chianti.outputs.version }}-
      - name: Test with pytest
        run: |
          pip install pytest-cov
          pytest --cov=. --cov-report=xml
      - name: Upload the article
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: article
          path: esis_instrument_paper/esis-instrument.pdf
          if-no-files-found: error
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          env_vars: OS,PYTHON
          name: codecov-umbrella
